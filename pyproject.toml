[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clxparser"
version = "0.1.0"
description = "A lightweight, dependency-minimal parser for Clinx chemiluminescence instrument .clx files (metadata + 16-bit fluorescence and bright-field images)."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "clxparser contributors" }]
keywords = ["clx", "chemiluminescence", "imager", "tiff", "fluorescence", "brightfield"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
image = ["tifffile>=2022.0", "Pillow>=9.0"]
test = ["pytest>=7.0"]

[project.scripts]
clxparser = "clxparser.cli:main"

[tool.setuptools]
packages = ["clxparser"]

[tool.setuptools.package-data]
clxparser = ["py.typed"]
